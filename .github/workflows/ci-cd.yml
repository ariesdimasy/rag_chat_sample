name: CI/CD Pipeline
on:
  push:
    branches: [main] # jalan saat push

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest -v # test!

  deploy:
    needs: [test-backend] # tunggu lulus
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy..."
