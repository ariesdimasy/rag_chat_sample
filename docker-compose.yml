services:
  # Backend: FastAPI
  backend:
    build: ./rag_api_project
    env_file:
      - ./rag_api_project/.env
    ports:
      - "8000:8000"

  # Frontend: Next.js
  frontend:
    build:
      context: ./rag_chat_frontend
      dockerfile: dockerfile
    env_file:
      - ./rag_chat_frontend/.env.local
    ports:
      - "3000:3000"
    environment:
      # bicara ke backend via NAMA service
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  nginx: # pintu masuk
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]
